    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var rawMode = params.get('mode') || params.get('theme');
          var urlTheme = rawMode === 'right' ? 'light' : rawMode;
          var urlLang = params.get('lang');
          var cachedTheme = localStorage.getItem('sparta_theme_v2');
          var cachedLang = localStorage.getItem('sparta_language_v2');
          var theme = (urlTheme === 'light' || urlTheme === 'dark')
            ? urlTheme
            : ((cachedTheme === 'light' || cachedTheme === 'dark') ? cachedTheme : 'light');
          var lang = (urlLang === 'in' || urlLang === 'en')
            ? urlLang
            : ((cachedLang === 'in' || cachedLang === 'en') ? cachedLang : 'in');
          var root = document.documentElement;
          root.lang = lang === 'en' ? 'en' : 'id';
          if (theme === 'dark') {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
            root.style.backgroundColor = '#09090b';
          } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
            root.style.backgroundColor = '#ffffff';
          }
        } catch (e) {}
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
